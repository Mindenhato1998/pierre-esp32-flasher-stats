name: Update Flash Counter Gist

on:
  workflow_dispatch:
    inputs:
      counter_data:
        description: 'Flash counter JSON data'
        required: true
        type: string

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Update Gist
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          script: |
            const gistId = 'GIST_ID_HERE';
            const filename = 'flash-counter.json';
            const content = ${{ github.event.inputs.counter_data }};

            await github.rest.gists.update({
              gist_id: gistId,
              files: {
                [filename]: {
                  content: JSON.stringify(content, null, 2)
                }
              }
            });

            console.log('✅ Gist updated successfully');